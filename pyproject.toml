[build-system]
      requires = ["setuptools>=68"]
      build-backend = "setuptools.build_meta"

      [project]
      name = "openlineage-governance-control-plane"
      version = "0.1.0"
      description = "OpenLineage Governance Control Plane - synthetic portfolio implementation"
      requires-python = ">=3.9"
      dependencies = [
        "fastapi>=0.115,<0.116",
"uvicorn>=0.30,<0.35",
"pydantic>=2.9,<3",
      ]

      [project.optional-dependencies]
      test = ["pytest>=8,<9", "httpx>=0.27,<0.29"]

      [tool.setuptools.packages.find]
      where = ["src"]

      [tool.setuptools.package-data]
      "*" = ["*.sql"]

      [tool.pytest.ini_options]
      testpaths = ["tests"]
      pythonpath = ["src"]
