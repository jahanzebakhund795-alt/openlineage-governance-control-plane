services:
  governance:
    build: .
    command: uvicorn governance_plane.api:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      GOVERNANCE_ADMIN_KEY: ${GOVERNANCE_ADMIN_KEY:?set admin key}
      GOVERNANCE_READER_KEY: ${GOVERNANCE_READER_KEY:?set reader key}
      MASKING_KEY: ${MASKING_KEY:?set masking key}
      CATALOG_DB: /data/catalog.sqlite
    volumes: [catalog-data:/data]
    ports: ['127.0.0.1:8000:8000']
volumes:
  catalog-data:
